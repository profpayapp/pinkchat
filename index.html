<div id="voiceRoom" style="display:none;">
  <h3 id="roomName"></h3>
  <button onclick="leaveRoom()">Leave Room</button>
  <div id="participants"></div>
  
  <div style="height:150px; background:#1a1a1a; border-radius:12px; margin:12px 0;">
    <div id="roomChatBox" style="height:100px; overflow-y:auto; padding:10px; font-size:13px; text-align:left;"></div>
    <div style="display:flex; padding:8px; gap:6px;">
      <input id="roomChatInput" placeholder="Chat in room..." style="flex:1; background:#333; border:none; color:white; padding:10px; border-radius:8px;"/>
      <button onclick="sendVoiceRoomMsg()" style="background:#ff1493; border:none; color:white; padding:10px 16px; border-radius:8px; font-weight:bold;">Send</button>
    </div>
  </div>

  <button id="micBtn" onclick="toggleMic()" style="width:50px; height:50px; border-radius:50%; border:none; font-size:22px; background:white;">🎤</button>
  <button onclick="leaveRoom()" style="width:50px; height:50px; border-radius:50%; border:none; font-size:22px; background:red; color:white;">❌</button>
</div>
